<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scree DOM snapshot lab</title>
    <style>
      html, body { margin: 0; background: #14110f; color: #ece4d8; font-family: system-ui, sans-serif; }
      .row { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
      .screen { width: 560px; height: 360px; box-sizing: border-box; padding: 24px; border-radius: 16px; background: #1f1a17; display: grid; gap: 16px; align-content: start; }
      .screen h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
      .card { padding: 16px; border-radius: 12px; background: #e8603c; color: #1b0f0a; font-weight: 600; }
      .chip { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #3b8f7a; color: #06201a; font-size: 13px; }
      .bars { display: flex; gap: 8px; align-items: flex-end; height: 90px; }
      .bars i { flex: 1; background: #c9b27c; border-radius: 4px 4px 0 0; }
      #stage { width: 560px; height: 360px; border-radius: 16px; background: #0d0b0a; }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: #ece4d8; color: #14110f; cursor: pointer; }
      #log { font: 12px monospace; padding: 0 16px; opacity: 0.8; white-space: pre; }
    </style>
  </head>
  <body>
    <div class="row">
      <div id="a" class="screen">
        <h1>Dashboard</h1>
        <div class="card" data-scree="revenue">Revenue 48,200</div>
        <div class="bars" data-scree="chart"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:65%"></i></div>
        <span class="chip" data-scree="status">Live</span>
      </div>
      <div id="b" class="screen">
        <h1>Settings</h1>
        <span class="chip" data-scree="status">Saved</span>
        <div class="card" data-scree="revenue">Plan: Pro</div>
        <div class="bars" data-scree="chart"><i style="height:90%"></i><i style="height:30%"></i><i style="height:60%"></i></div>
      </div>
      <canvas id="stage"></canvas>
    </div>
    <div class="row"><button id="play">Play a → b</button><button id="back">Play b → a</button></div>
    <div id="log"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
