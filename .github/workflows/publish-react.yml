# Publishes scree-react to npm when a GitHub release tagged "react-v<version>" is published.
#
# Uses npm trusted publishing (OIDC): no npm token and no one-time password.
# One-time setup on npmjs.com → scree-react → Settings → Trusted Publisher:
#   GitHub Actions · owner: imshivamb · repository: Scree · workflow: publish-react.yml
# (The very first publish of a new package has to be done by hand, because a
# trusted publisher can only be added to a package that already exists.)
#
# To release: bump "version" in packages/react/package.json, push, then create a
# GitHub release tagged react-v<version> (e.g. react-v0.1.0).
name: Publish scree-react to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'react-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the release tag matches packages/react/package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./packages/react/package.json').version")"
          tag="${GITHUB_REF_NAME#react-v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match packages/react version $version" >&2
            exit 1
          fi

      - run: npm test
      - run: npm run build:react

      - run: npm publish --access public --provenance
        working-directory: packages/react
