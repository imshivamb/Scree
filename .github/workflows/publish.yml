# Publishes scree-core to npm when a GitHub release is published.
#
# Uses npm trusted publishing (OIDC): no npm token and no one-time password.
# One-time setup on npmjs.com → scree-core → Settings → Trusted Publisher:
#   GitHub Actions · owner: imshivamb · repository: Scree · workflow: publish.yml
#
# To release: bump "version" in package.json, push, then create a GitHub
# release whose tag matches it (e.g. v0.2.0). This workflow does the rest.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this run came from this repository

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # prepublishOnly runs the tests and builds the library and its types.
      - run: npm publish --access public
